# CI：push / PR 到 main 时跑 lint、格式、单测、类型检查、构建与 e2e
#
# 说明：
# - Pages 部署由 static.yml 在 CI 现场构建 dist 完成，本 workflow 只做质量校验。
# - E2E 使用生产构建 + vite preview，Playwright 在 CI 上自动安装浏览器。

name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (0 warnings)
        run: pnpm lint:check

      - name: Format check (source files; data/*.json 为历史数据不做重排)
        run: pnpm prettier --check "src/**/*.{ts,vue}"

      - name: Unit & component tests with coverage
        run: pnpm test:coverage

      - name: Typecheck + build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
